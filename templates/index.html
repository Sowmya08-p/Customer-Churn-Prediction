<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 450px; margin: auto; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; }
        .result { margin-top: 20px; padding: 15px; background: #e7f3ff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Customer Churn Predictor</h2>
        <form action="/predict" method="post">
            <label>Gender</label><select name="gender"><option>Male</option><option>Female</option></select>
            <label>Senior Citizen</label><select name="SeniorCitizen"><option value="0">No</option><option value="1">Yes</option></select>
            <label>Partner</label><select name="Partner"><option>Yes</option><option>No</option></select>
            <label>Dependents</label><select name="Dependents"><option>Yes</option><option>No</option></select>
            <label>Tenure</label><input type="number" name="tenure">
            <label>PhoneService</label><select name="PhoneService"><option>Yes</option><option>No</option></select>
            <label>MultipleLines</label><select name="MultipleLines"><option>Yes</option><option>No</option><option>No phone service</option></select>
            <label>InternetService</label><select name="InternetService"><option>DSL</option><option>Fiber optic</option><option>No</option></select>
            <label>OnlineSecurity</label><select name="OnlineSecurity"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>OnlineBackup</label><select name="OnlineBackup"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>DeviceProtection</label><select name="DeviceProtection"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>TechSupport</label><select name="TechSupport"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>StreamingTV</label><select name="StreamingTV"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>StreamingMovies</label><select name="StreamingMovies"><option>Yes</option><option>No</option><option>No internet service</option></select>
            <label>Contract</label><select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select>
            <label>PaperlessBilling</label><select name="PaperlessBilling"><option>Yes</option><option>No</option></select>
            <label>PaymentMethod</label><select name="PaymentMethod"><option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option></select>
            <label>MonthlyCharges</label><input type="number" step="0.01" name="MonthlyCharges">
            <label>TotalCharges</label><input type="number" step="0.01" name="TotalCharges">
            <button type="submit">Predict</button>
        </form>
        39    {% if prediction %}<div class="result"><h3>Prediction: {{ prediction }}</h3><p>Churn Probability: {{ prob }}%</p></div>{% endif %}

    <a href="/metrics" style="display:block; text-align:center; margin-top:20px; color:#007bff; font-weight:bold;">
        View Model Accuracy & F1 Score
    </a>
40    </div>
41  </body>
