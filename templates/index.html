<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 700px; margin: auto; }
        h2 { text-align: center; color: #333; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; margin-top: 20px; }
        .result { text-align: center; margin-top: 20px; padding: 15px; background: #e9ffe9; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Customer Churn Predictor</h2>
        <form action="/predict" method="post">
            <div class="form-grid">
                <div><label>Gender</label><select name="gender"><option>Male</option><option>Female</option></select></div>
                <div><label>SeniorCitizen</label><select name="SeniorCitizen"><option>0</option><option>1</option></select></div>
                <div><label>Partner</label><select name="Partner"><option>Yes</option><option>No</option></select></div>
                <div><label>Dependents</label><select name="Dependents"><option>Yes</option><option>No</option></select></div>
                <div><label>Tenure</label><input type="number" name="tenure" required></div>
                <div><label>PhoneService</label><select name="PhoneService"><option>Yes</option><option>No</option></select></div>
                <div><label>MultipleLines</label><select name="MultipleLines"><option>Yes</option><option>No</option><option>No phone service</option></select></div>
                <div><label>InternetService</label><select name="InternetService"><option>DSL</option><option>Fiber optic</option><option>No</option></select></div>
                <div><label>OnlineSecurity</label><select name="OnlineSecurity"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>OnlineBackup</label><select name="OnlineBackup"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>DeviceProtection</label><select name="DeviceProtection"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>TechSupport</label><select name="TechSupport"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>StreamingTV</label><select name="StreamingTV"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>StreamingMovies</label><select name="StreamingMovies"><option>Yes</option><option>No</option><option>No internet service</option></select></div>
                <div><label>Contract</label><select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></div>
                <div><label>PaperlessBilling</label><select name="PaperlessBilling"><option>Yes</option><option>No</option></select></div>
                <div><label>PaymentMethod</label><select name="PaymentMethod"><option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option></select></div>
                <div><label>MonthlyCharges</label><input type="number" step="0.01" name="MonthlyCharges" required></div>
                <div><label>TotalCharges</label><input type="number" step="0.01" name="TotalCharges" required></div>
            </div>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h3>Prediction: {{ prediction }}</h3>
            <p>Churn Probability: {{ prob }}%</p>
        </div>
        {% endif %}

        <a href="/metrics" style="display:block; text-align:center; margin-top:20px; color:#007bff; font-weight:bold;">
            View Model Accuracy & F1 Score
        </a>
    </div>
</body>
</html>
