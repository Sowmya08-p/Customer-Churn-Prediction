<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 450px; max-height: 90vh; overflow-y: auto; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Customer Churn Predictor</h2>
        <form action="/predict" method="post">
            <label>Gender</label>
            <select name="gender" required><option value="Male">Male</option><option value="Female">Female</option></select>
            
            <label>Senior Citizen</label>
            <select name="SeniorCitizen" required><option value="0">No</option><option value="1">Yes</option></select>
            
            <label>Partner</label>
            <select name="Partner" required><option value="Yes">Yes</option><option value="No">No</option></select>
            
            <label>Dependents</label>
            <select name="Dependents" required><option value="Yes">Yes</option><option value="No">No</option></select>
            
            <label>Tenure in months</label>
            <input type="number" name="tenure" required>
            
            <label>Phone Service</label>
            <select name="PhoneService" required><option value="Yes">Yes</option><option value="No">No</option></select>
            
            <label>Multiple Lines</label>
            <select name="MultipleLines" required><option value="Yes">Yes</option><option value="No">No</option><option value="No phone service">No phone service</option></select>
            
            <label>Internet Service</label>
            <select name="InternetService" required><option value="DSL">DSL</option><option value="Fiber optic">Fiber optic</option><option value="No">No</option></select>
            
            <label>Online Security</label>
            <select name="OnlineSecurity" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Online Backup</label>
            <select name="OnlineBackup" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Device Protection</label>
            <select name="DeviceProtection" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Tech Support</label>
            <select name="TechSupport" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Streaming TV</label>
            <select name="StreamingTV" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Streaming Movies</label>
            <select name="StreamingMovies" required><option value="Yes">Yes</option><option value="No">No</option><option value="No internet service">No internet service</option></select>
            
            <label>Contract</label>
            <select name="Contract" required><option value="Month-to-month">Month-to-month</option><option value="One year">One year</option><option value="Two year">Two year</option></select>
            
            <label>Paperless Billing</label>
            <select name="PaperlessBilling" required><option value="Yes">Yes</option><option value="No">No</option></select>
            
            <label>Payment Method</label>
            <select name="PaymentMethod" required>
                <option value="Electronic check">Electronic check</option>
                <option value="Mailed check">Mailed check</option>
                <option value="Bank transfer (automatic)">Bank transfer</option>
                <option value="Credit card (automatic)">Credit card</option>
            </select>
            
            <label>Monthly Charges</label>
            <input type="number" step="0.01" name="MonthlyCharges" required>
            
            <label>Total Charges</label>
            <input type="number" step="0.01" name="TotalCharges" required>
            
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h3>Prediction: {{ prediction }}</h3>
            <p>Churn Probability: {{ prob }}%</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
